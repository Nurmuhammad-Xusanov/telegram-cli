<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <style>
      .bg { fill: #000000; }
      .border { stroke: #222222; stroke-width: 1.5; }
      .text-title { fill: #ffffff; font-family: monospace; font-size: 13px; font-weight: bold; }
      .text-muted { fill: #666666; font-family: monospace; font-size: 12px; }
      .text-normal { fill: #aaaaaa; font-family: monospace; font-size: 12px; }
      .text-bold { fill: #ffffff; font-family: monospace; font-size: 12px; font-weight: bold; }
      .text-active { fill: #ffffff; font-family: monospace; font-size: 12px; font-weight: bold; }
      .text-badge { fill: #ffffff; font-family: monospace; font-size: 11px; font-weight: bold; }
      .active-bg { fill: #181818; }
      .tag { fill: #ffffff; font-weight: bold; }
      .cursor { fill: #ffffff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" class="bg" rx="10" stroke="#333333" stroke-width="2"/>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="900" height="30" fill="#0d0d0d" rx="10"/>
  <rect x="0" y="20" width="900" height="10" fill="#0d0d0d"/>
  <circle cx="20" cy="15" r="5" fill="#333333"/>
  <circle cx="36" cy="15" r="5" fill="#333333"/>
  <circle cx="52" cy="15" r="5" fill="#333333"/>
  <text x="450" y="19" text-anchor="middle" class="text-muted" font-size="11">telegram-cli — Linux Terminal (OLED Pure Black)</text>

  <!-- Left Panel: Search & Chat List (width: 250) -->
  <!-- Search input -->
  <rect x="0" y="30" width="250" height="35" class="bg"/>
  <line x1="0" y1="65" x2="250" y2="65" class="border"/>
  <text x="15" y="52" class="text-muted">Search (/)...</text>

  <!-- Vertical Divider -->
  <line x1="250" y1="30" x2="250" y2="480" class="border"/>

  <!-- Chat items -->
  <rect x="0" y="66" width="250" height="32" class="active-bg"/>
  <text x="15" y="86" class="text-active">› Alex Morgan</text>

  <text x="25" y="118" class="text-bold">Sarah Connor</text>
  <text x="225" y="118" class="text-badge">1</text>

  <text x="25" y="150" class="text-normal">David Miller</text>
  <text x="25" y="182" class="text-normal">Dev Team Group</text>
  <text x="25" y="214" class="text-bold">Jessica Alba</text>
  <text x="225" y="214" class="text-badge">1</text>
  <text x="25" y="246" class="text-normal">Michael Scott</text>
  <text x="25" y="278" class="text-normal">Rachel Green</text>
  <text x="25" y="310" class="text-normal">Product Roadmap</text>

  <!-- Right Panel: Active Chat -->
  <!-- Chat Header -->
  <rect x="250" y="30" width="650" height="35" class="bg"/>
  <line x1="250" y1="65" x2="900" y2="65" class="border"/>
  <text x="270" y="52" class="text-title">Chat: Alex Morgan</text>

  <!-- Messages History -->
  <text x="270" y="105" class="text-muted">14:10</text>
  <text x="320" y="105" class="text-bold">Alex Morgan:</text>
  <text x="425" y="105" class="text-normal">Hey, are you joining the architecture meeting today?</text>

  <text x="270" y="140" class="text-muted">14:12</text>
  <text x="320" y="140" class="text-bold">You:</text>
  <text x="360" y="140" class="text-normal">Yes, starting in 15 minutes. Did you review the doc?</text>

  <text x="270" y="175" class="text-muted">14:15</text>
  <text x="320" y="175" class="text-bold">Alex Morgan:</text>
  <text x="425" y="175" class="text-normal">Yes, here is the diagram sketch:</text>

  <text x="270" y="210" class="text-muted">14:15</text>
  <text x="320" y="210" class="text-bold">Alex Morgan:</text>
  <text x="425" y="210" class="tag">[Photo #1]</text>
  <text x="500" y="210" class="text-muted">Architecture_v2_final.png</text>

  <text x="270" y="245" class="text-muted">14:18</text>
  <text x="320" y="245" class="text-bold">You:</text>
  <text x="360" y="245" class="text-normal">Looks clean and solid. Opening it via /1 to check details.</text>

  <text x="270" y="280" class="text-muted">14:19</text>
  <text x="320" y="280" class="text-bold">Alex Morgan:</text>
  <text x="425" y="280" class="tag">[Voice 18s #2]</text>

  <!-- Message Input Bar -->
  <line x1="250" y1="440" x2="900" y2="440" class="border"/>
  <rect x="250" y="441" width="650" height="38" class="bg"/>
  <text x="270" y="465" class="text-muted">Message... (/1 to open media, /send &lt;path&gt;, F3: last media)</text>
  <rect x="680" y="453" width="7" height="15" class="cursor"/>
</svg>
